<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" role="img" aria-label="Wirun Pingwang — IT Project Manager">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.55" stop-color="#0f2027"/>
      <stop offset="1" stop-color="#16323d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00ffd5"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#00ffd5" stroke-opacity="0.06"/>
    </pattern>
    <style>
      .mono { font-family: 'Fira Code','JetBrains Mono',Consolas,'Courier New',monospace; }
      .sans { font-family: 'Segoe UI',Helvetica,Arial,sans-serif; }
      .line { animation: show .5s ease-out both; }
      .l1 { animation-delay: .3s } .l2 { animation-delay: 1.1s } .l3 { animation-delay: 1.9s } .l4 { animation-delay: 2.6s }
      .cursor { animation: blink 1s steps(1) infinite; }
      .scan { animation: scan 6s linear infinite; }
      @keyframes show { from { opacity: 0 } }
      @keyframes blink { 50% { opacity: 0 } }
      @keyframes scan { from { transform: translateY(-40px) } to { transform: translateY(260px) } }
    </style>
  </defs>

  <rect width="900" height="260" rx="14" fill="url(#bg)"/>
  <rect width="900" height="260" rx="14" fill="url(#grid)"/>
  <rect class="scan" x="0" y="0" width="900" height="40" fill="#00ffd5" opacity="0.04"/>

  <!-- terminal window chrome -->
  <rect x="0.5" y="0.5" width="899" height="259" rx="14" fill="none" stroke="#00ffd5" stroke-opacity="0.25"/>
  <circle cx="26" cy="24" r="6" fill="#ff5f56"/>
  <circle cx="46" cy="24" r="6" fill="#ffbd2e"/>
  <circle cx="66" cy="24" r="6" fill="#27c93f"/>
  <text x="450" y="29" text-anchor="middle" class="mono" font-size="13" fill="#7f9cab">karn@dohome: ~/profile — zsh</text>
  <line x1="0" y1="44" x2="900" y2="44" stroke="#00ffd5" stroke-opacity="0.15"/>

  <!-- terminal lines -->
  <g class="mono" font-size="16">
    <text class="line l1" x="36" y="84"><tspan fill="#27c93f">➜</tspan><tspan fill="#38bdf8"> ~</tspan><tspan fill="#e2e8f0"> whoami</tspan></text>
    <text class="line l2 sans" x="36" y="136" font-size="44" font-weight="700" fill="url(#accent)">Wirun Pingwang</text>
    <text class="line l3" x="38" y="172" fill="#cbd5e1">Assistant Vice President, Project Department, Dohome <tspan fill="#00ffd5">·</tspan> ERP <tspan fill="#00ffd5">·</tspan> E-Commerce <tspan fill="#00ffd5">·</tspan> POS</text>
    <text class="line l4" x="36" y="216"><tspan fill="#27c93f">➜</tspan><tspan fill="#38bdf8"> ~</tspan><tspan fill="#7f9cab"> echo $MOTTO  </tspan><tspan fill="#facc15">"No pain, no gain"</tspan><tspan class="cursor" fill="#00ffd5"> █</tspan></text>
  </g>

  <!-- right side code ornament -->
  <g class="mono" font-size="13" fill="#00ffd5" fill-opacity="0.35" xml:space="preserve">
    <text x="640" y="84">void on_Impact(person his) {</text>
    <text x="640" y="104">  if (his.words &gt; this.mind)</text>
    <text x="640" y="124">    Life.Time--;</text>
    <text x="640" y="144">}</text>
  </g>
  <g class="mono" font-size="12" fill="#7f9cab">
    <text x="548" y="236">{ since: 2012, based_in: "Pathum Thani, TH" }</text>
  </g>
</svg>
